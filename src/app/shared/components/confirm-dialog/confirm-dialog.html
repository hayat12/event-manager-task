<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close cdkFocusInitial i18n="@@shared.actions.cancel">Abbrechen</button>
  <button mat-flat-button type="button" class="confirm" [mat-dialog-close]="true">
    @if (data.confirmLabel) {
      {{ data.confirmLabel }}
    } @else {
      <ng-container i18n="@@shared.actions.confirm">Bestätigen</ng-container>
    }
  </button>
</mat-dialog-actions>
